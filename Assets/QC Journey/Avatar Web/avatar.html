<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Avatar Generator</title>
  <script src="avataaars.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      text-align: center;
      padding: 20px;
    }
    #avatarContainer {
      margin: 0 auto 20px auto;
      width: 132px;
      height: 140px;
    }
    .dropdown-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .form-group {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    select {
      width: 100%;
      font-size: 16px;
      padding: 8px;
      margin-top: 5px;
    }
    button, a {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Custom Avatar Generator</h2>
  <div id="avatarContainer"></div>

  <div class="dropdown-grid">
    <!-- Top -->
    <div class="form-group">
      <label>Top (Hair Style):
        <select id="top">
          <option value="dreads01">Dreads 01</option>
          <option value="shortFlat">Short Flat</option>
          <option value="bob">Bob</option>
          <option value="curly">Curly</option>
          <option value="hat">Hat</option>
        </select>
      </label>
    </div>

    <!-- Hair Color -->
    <div class="form-group">
      <label>Hair Color:
        <select id="hairColor">
          <option value="black">Black</option>
          <option value="brown">Brown</option>
          <option value="blonde">Blonde</option>
          <option value="silverGray">Silver Gray</option>
        </select>
      </label>
    </div>

    <!-- Skin -->
    <div class="form-group">
      <label>Skin:
        <select id="skin">
          <option value="light">Light</option>
          <option value="brown">Brown</option>
          <option value="darkBrown">Dark Brown</option>
        </select>
      </label>
    </div>

    <!-- Eyes -->
    <div class="form-group">
      <label>Eyes:
        <select id="eyes">
          <option value="default">Default</option>
          <option value="happy">Happy</option>
          <option value="surprised">Surprised</option>
        </select>
      </label>
    </div>

    <!-- Eyebrows -->
    <div class="form-group">
      <label>Eyebrows:
        <select id="eyebrows">
          <option value="defaultNatural">Default Natural</option>
          <option value="raisedExcitedNatural">Raised Excited Natural</option>
          <option value="frownNatural">Frown Natural</option>
        </select>
      </label>
    </div>

    <!-- Mouth -->
    <div class="form-group">
      <label>Mouth:
        <select id="mouth">
          <option value="default">Default</option>
          <option value="smile">Smile</option>
          <option value="serious">Serious</option>
        </select>
      </label>
    </div>

    <!-- Clothing -->
    <div class="form-group">
      <label>Clothing:
        <select id="clothing">
          <option value="shirtCrewNeck">Shirt Crew Neck</option>
          <option value="hoodie">Hoodie</option>
          <option value="blazerAndSweater">Blazer & Sweater</option>
        </select>
      </label>
    </div>

    <!-- Clothing Color -->
    <div class="form-group">
      <label>Clothing Color:
        <select id="clothingColor">
          <option value="black">Black</option>
          <option value="blue02">Blue 02</option>
          <option value="red">Red</option>
        </select>
      </label>
    </div>

    <!-- Accessories -->
    <div class="form-group">
      <label>Accessories:
        <select id="accessories">
          <option value="none">None</option>
          <option value="sunglasses">Sunglasses</option>
          <option value="round">Round</option>
        </select>
      </label>
    </div>

    <!-- Style -->
    <div class="form-group">
      <label>Style:
        <select id="style">
          <option value="circle">Circle</option>
          <option value="transparent">Transparent</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Control Buttons -->
  <div>
    <button onclick="generateAvatar()">Generate Avatar</button>
    <button onclick="randomizeAvatar()">🎲 Randomize Avatar</button>
    <a id="downloadLink" href="#" download="avatar.png">Download Avatar</a>
  </div>

  <!-- JS Functions -->
  <script>
    function generateAvatar() {
      const options = {
        top: document.getElementById('top').value,
        hairColor: document.getElementById('hairColor').value,
        skin: document.getElementById('skin').value,
        eyes: document.getElementById('eyes').value,
        eyebrows: document.getElementById('eyebrows').value,
        mouth: document.getElementById('mouth').value,
        clothing: document.getElementById('clothing').value,
        clothingColor: document.getElementById('clothingColor').value,
        accessories: document.getElementById('accessories').value,
        style: document.getElementById('style').value,
      };

      const svg = Avataaars.create(options);
      document.getElementById("avatarContainer").innerHTML = svg;

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(document.querySelector("svg"));
      const svgBlob = new Blob([svgString], { type: "image/svg+xml" });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 132;
        canvas.height = 140;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const base64 = canvas.toDataURL("image/png");

        document.getElementById("downloadLink").href = base64;

        if (window.Unity && typeof window.Unity.call === "function") {
          window.Unity.call("avatar:" + base64.split(',')[1]);
        } else {
          console.warn("Unity WebViewObject not available.");
        }
      };
      img.onerror = () => console.error("❌ Failed to load image from SVG blob.");
      img.src = url;
    }

    function randomizeAvatar() {
      const dropdownIds = [
        'top', 'hairColor', 'skin', 'eyes', 'eyebrows',
        'mouth', 'clothing', 'clothingColor', 'accessories', 'style'
      ];
      dropdownIds.forEach(id => {
        const select = document.getElementById(id);
        const options = select.options;
        const randomIndex = Math.floor(Math.random() * options.length);
        select.selectedIndex = randomIndex;
      });
      generateAvatar();
    }

    window.onload = generateAvatar;
  </script>
</body>
</html>
